<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supabase Auth Demo - kakao</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS CDN (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            kakaoYellow: '#FEE500',
            kakaoBrown: '#191919',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-kakaoYellow flex items-center justify-center font-black text-kakaoBrown shadow-sm">
          K
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight tracking-tight text-slate-900">Kakao Portal</h1>
          <p class="text-xs text-slate-400">kwckmw.github.io/kakao</p>
        </div>
      </div>
      <div id="header-user-area" class="hidden items-center gap-3">
        <span id="header-user-email" class="text-xs font-medium text-slate-600 bg-slate-100 px-3 py-1.5 rounded-full"></span>
        <button onclick="handleSignOut()" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg transition font-medium">
          로그아웃
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-8 flex flex-col items-center justify-center">

    <!-- 1. 비로그인 상태 카드 (인증 카드) -->
    <div id="auth-card" class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-6 sm:p-8">
      
      <!-- 상단 탭 -->
      <div class="flex border-b border-slate-200 mb-6 text-sm font-semibold">
        <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 pb-3 text-indigo-600 border-b-2 border-indigo-600 transition">
          로그인
        </button>
        <button id="tab-signup" onclick="switchAuthTab('signup')" class="flex-1 pb-3 text-slate-400 hover:text-slate-600 transition">
          회원가입
        </button>
      </div>

      <!-- 에러/성공 메시지 알림 영역 -->
      <div id="auth-alert" class="hidden mb-4 p-3 rounded-lg text-xs leading-normal"></div>

      <!-- 인증 폼 -->
      <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1" for="email">이메일 계정</label>
          <input
            type="email"
            id="email"
            required
            placeholder="user@example.com"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1" for="password">비밀번호</label>
          <input
            type="password"
            id="password"
            required
            minlength="6"
            placeholder="6자리 이상 입력"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
          />
        </div>

        <button
          type="submit"
          id="btn-auth-submit"
          class="w-full py-3 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-medium text-sm transition shadow-sm active:scale-[0.99] flex items-center justify-center gap-2"
        >
          <span id="btn-submit-text">로그인</span>
          <svg id="btn-spinner" class="hidden animate-spin h-4 w-4 text-white" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
        </button>
      </form>

      <div class="mt-6 text-center text-xs text-slate-400">
        Supabase Authentication Powered
      </div>
    </div>

    <!-- 2. 로그인 성공 상태 카드 (대시보드) -->
    <div id="dashboard-card" class="hidden w-full max-w-2xl bg-white rounded-2xl shadow-xl border border-slate-100 p-6 sm:p-8 space-y-6">
      
      <div class="flex items-center justify-between border-b border-slate-100 pb-5">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold text-xl">
            👤
          </div>
          <div>
            <h2 class="font-bold text-lg text-slate-900">사용자 대시보드</h2>
            <p class="text-xs text-emerald-600 font-semibold flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
              인증 완료 (Authenticated)
            </p>
          </div>
        </div>
        <button onclick="handleSignOut()" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold px-3.5 py-2 rounded-xl transition">
          로그아웃
        </button>
      </div>

      <!-- 사용자 세부 정보 요약 -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="p-4 rounded-xl bg-slate-50 border border-slate-100">
          <span class="block text-xs font-semibold text-slate-400 mb-1">계정 이메일</span>
          <span id="dash-email" class="text-sm font-bold text-slate-800 break-all">-</span>
        </div>
        <div class="p-4 rounded-xl bg-slate-50 border border-slate-100">
          <span class="block text-xs font-semibold text-slate-400 mb-1">고유 UID</span>
          <span id="dash-uid" class="text-xs font-mono text-slate-700 break-all">-</span>
        </div>
        <div class="p-4 rounded-xl bg-slate-50 border border-slate-100 sm:col-span-2">
          <span class="block text-xs font-semibold text-slate-400 mb-1">마지막 로그인 시각</span>
          <span id="dash-last-sign-in" class="text-xs text-slate-700">-</span>
        </div>
      </div>

      <!-- 세션 메타데이터 디버그 뷰 -->
      <div>
        <h3 class="text-xs font-semibold text-slate-500 mb-2">세션 객체 (JSON Data)</h3>
        <pre id="dash-raw-session" class="p-4 rounded-xl bg-slate-900 text-emerald-400 font-mono text-xs overflow-x-auto max-h-56 leading-relaxed"></pre>
      </div>
    </div>

  </main>

  <footer class="py-6 text-center text-xs text-slate-400 border-t border-slate-100">
    &copy; 2026 kwckmw.github.io/kakao &middot; Built with Supabase & Tailwind CSS
  </footer>

  <!-- App Script -->
  <script>
    // ==========================================
    // 1. Supabase 연동 정보
    // ==========================================
    const SUPABASE_URL = "https://yfzyxqtqxufyteukjslb.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlmenl4cXRxeHVmeXRldWtqc2xiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3NzQyMDIsImV4cCI6MjEwNzM1MDIwMn0.ezskhWtqLFAMqBigd03f-kvkMHbnTAGNRs3OPHj4M6s";

    let supabaseClient = null;
    let authMode = "login"; // "login" | "signup"

    try {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) {
      console.error("Supabase 초기화 실패:", e);
    }

    // ==========================================
    // 2. 인증 탭 전환 (로그인 / 회원가입)
    // ==========================================
    function switchAuthTab(mode) {
      authMode = mode;
      hideAlert();

      const tabLogin = document.getElementById("tab-login");
      const tabSignUp = document.getElementById("tab-signup");
      const submitText = document.getElementById("btn-submit-text");

      if (mode === "login") {
        tabLogin.className = "flex-1 pb-3 text-indigo-600 border-b-2 border-indigo-600 transition font-semibold";
        tabSignUp.className = "flex-1 pb-3 text-slate-400 hover:text-slate-600 transition font-semibold";
        submitText.textContent = "로그인";
      } else {
        tabSignUp.className = "flex-1 pb-3 text-indigo-600 border-b-2 border-indigo-600 transition font-semibold";
        tabLogin.className = "flex-1 pb-3 text-slate-400 hover:text-slate-600 transition font-semibold";
        submitText.textContent = "새 계정 만들기";
      }
    }

    function showAlert(message, type = "error") {
      const alertBox = document.getElementById("auth-alert");
      alertBox.classList.remove("hidden", "bg-rose-50", "text-rose-700", "border-rose-200", "bg-emerald-50", "text-emerald-700", "border-emerald-200");
      if (type === "error") {
        alertBox.classList.add("bg-rose-50", "text-rose-700", "border", "border-rose-200");
      } else {
        alertBox.classList.add("bg-emerald-50", "text-emerald-700", "border", "border-emerald-200");
      }
      alertBox.textContent = message;
    }

    function hideAlert() {
      document.getElementById("auth-alert").classList.add("hidden");
    }

    function setLoading(isLoading) {
      const spinner = document.getElementById("btn-spinner");
      const btn = document.getElementById("btn-auth-submit");
      btn.disabled = isLoading;
      if (isLoading) {
        spinner.classList.remove("hidden");
        btn.classList.add("opacity-70", "cursor-not-allowed");
      } else {
        spinner.classList.add("hidden");
        btn.classList.remove("opacity-70", "cursor-not-allowed");
      }
    }

    // ==========================================
    // 3. 로그인 및 회원가입 처리
    // ==========================================
    async function handleAuthSubmit(event) {
      event.preventDefault();
      hideAlert();

      if (!supabaseClient) {
        showAlert("Supabase 클라이언트가 초기화되지 않았습니다.");
        return;
      }

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      setLoading(true);

      try {
        if (authMode === "login") {
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email,
            password
          });
          if (error) throw error;
          showAlert("성공적으로 로그인되었습니다.", "success");
        } else {
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
              emailRedirectTo: window.location.origin + window.location.pathname
            }
          });
          if (error) throw error;
          showAlert("회원가입 요청이 완료되었습니다. 이메일 인증 링크를 확인해 주세요.", "success");
        }
      } catch (err) {
        console.error("인증 에러:", err);
        showAlert(err.message || "인증 처리 중 오류가 발생했습니다.");
      } finally {
        setLoading(false);
      }
    }

    // ==========================================
    // 4. 로그아웃 처리
    // ==========================================
    async function handleSignOut() {
      if (!supabaseClient) return;
      try {
        const { error } = await supabaseClient.auth.signOut();
        if (error) throw error;
        showAlert("로그아웃 되었습니다.", "success");
      } catch (err) {
        console.error("로그아웃 실패:", err);
        alert("로그아웃 실패: " + err.message);
      }
    }

    // ==========================================
    // 5. 세션 상태 실시간 동기화
    // ==========================================
    function updateUI(session) {
      const authCard = document.getElementById("auth-card");
      const dashboardCard = document.getElementById("dashboard-card");
      const headerUserArea = document.getElementById("header-user-area");
      const headerUserEmail = document.getElementById("header-user-email");

      if (session && session.user) {
        const user = session.user;
        authCard.classList.add("hidden");
        dashboardCard.classList.remove("hidden");
        headerUserArea.classList.remove("hidden");
        headerUserArea.classList.add("flex");

        headerUserEmail.textContent = user.email || "사용자";
        document.getElementById("dash-email").textContent = user.email || "-";
        document.getElementById("dash-uid").textContent = user.id || "-";
        document.getElementById("dash-last-sign-in").textContent = user.last_sign_in_at
          ? new Date(user.last_sign_in_at).toLocaleString()
          : "기록 없음";

        document.getElementById("dash-raw-session").textContent = JSON.stringify(session, null, 2);
      } else {
        authCard.classList.remove("hidden");
        dashboardCard.classList.add("hidden");
        headerUserArea.classList.add("hidden");
        headerUserArea.classList.remove("flex");
      }
    }

    // 초기 로드 시 세션 확인 및 리스너 등록
    window.addEventListener("DOMContentLoaded", async () => {
      if (!supabaseClient) return;

      const { data: { session } } = await supabaseClient.auth.getSession();
      updateUI(session);

      supabaseClient.auth.onAuthStateChange((_event, session) => {
        updateUI(session);
      });
    });
  </script>
</body>
</html>
